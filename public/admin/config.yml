backend:
  name: github
  repo: Roger0806/devishal-website
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "exhibitions"
    label: "Tentoonstellingen"
    folder: "src/content/exhibitions"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Zaal", name: "room", widget: "string" }
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Beschrijving", name: "description", widget: "text" }
      - { label: "Data", name: "dates", widget: "string" }
      - { label: "Link", name: "link", widget: "string" }

  - name: "news"
    label: "Nieuws"
    folder: "src/content/news"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Beschrijving", name: "description", widget: "text" }

  - name: "gallery"
    label: "Galerij afbeeldingen"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Afbeelding", name: "image", widget: "image" }
      - { label: "Alt-tekst", name: "alt", widget: "string" }
      - { label: "Bijschrift", name: "caption", widget: "string" }

  - name: "paintings"
    label: "Schilderijen kunstenaarssectie"
    folder: "src/content/paintings"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Afbeelding", name: "image", widget: "image" }
      - { label: "Alt-tekst", name: "alt", widget: "string" }
      - { label: "Bijschrift", name: "caption", widget: "string" }
      - { label: "Positie klasse", name: "className", widget: "select", options: ["one", "two", "three", "four", "five", "six"] }

  - name: "navigation"
    label: "Menu navigatie"
    files:
      - name: "menu"
        label: "Menu-inhoud"
        file: "src/content/navigation/menu.md"
        fields:
          - label: "Hoofdonderdelen"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Link", name: "url", widget: "string" }
              - label: "Subonderdelen"
                name: "children"
                widget: "list"
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Link", name: "url", widget: "string" }
          - label: "Extra links"
            name: "quickLinks"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Link", name: "url", widget: "string" }
          - label: "Sociale links"
            name: "socialLinks"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Link", name: "url", widget: "string" }